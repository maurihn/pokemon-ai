<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Pokémon AI — Tu Pokédex con IA</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/src/style.css"/>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div class="header-inner">
    <div class="header-logo">
      <div class="pokeball-icon"></div>
      <div class="header-titles">
        <h1 class="app-title">Pokémon AI</h1>
        <p class="app-sub">Tu Pokédex viviente con IA</p>
        <p class="powered-by">⚡ Powered by <a href="https://agents.fusionai.now" target="_blank">FusionAI Agents</a></p>
      </div>
    </div>
  </div>
</header>

<!-- LOADING SCREEN -->
<div id="loadingScreen" class="loading-screen">
  <div class="loading-card">
    <div class="loading-pokeball"></div>
    <h2 class="loading-title">Cargando modelo de IA...</h2>
    <div class="loading-bar-wrap"><div id="loadingBar" class="loading-bar"></div></div>
    <p id="loadingStatus" class="loading-status">Iniciando...</p>
    <p class="loading-hint">El modelo se descarga una vez (~800MB) y queda en caché 🚀</p>
  </div>
</div>

<!-- CHAT CONTAINER -->
<div id="chatContainer" class="chat-container hidden">
  <div id="messages" class="messages"></div>
  <div class="input-area">
    <div id="voiceStatus" class="voice-status"></div>
    <div class="input-row">
      <input id="userInput" type="text" placeholder="Pregúntame sobre cualquier Pokémon..." autocomplete="off"/>
      <button id="voiceBtn" class="voice-btn" title="Hablar">🎙️</button>
      <button id="sendBtn" class="send-btn" title="Enviar">➤</button>
    </div>
    <div class="suggestions">
      <button class="chip" data-text="¿Cuáles son los tipos de Charizard?">🔥 Charizard</button>
      <button class="chip" data-text="¿Quién gana, Mewtwo vs Dragonite?">⚔️ Mewtwo vs Dragonite</button>
      <button class="chip" data-text="Explícame las debilidades de Gengar">👻 Gengar</button>
      <button class="chip" data-text="Compara Pikachu con Raichu">⚡ Pikachu vs Raichu</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL (full screen, from Pokédex design) -->
<div id="detailBackdrop" class="modal-backdrop hidden"></div>
<div id="detailModal" class="modal-wrap hidden">
  <div class="modal-body">
    <button id="detailClose" class="modal-close">✕</button>
    <div id="modalLeft" class="modal-left"></div>
    <div id="modalRight" class="modal-right"></div>
  </div>
</div>

<!-- BATTLE MODAL (comparison with animations) -->
<div id="battleModal" class="cmp-backdrop">
  <div id="cmpModal" class="cmp-modal">
    <button id="cmpClose" class="cmp-close">✕</button>
    <div id="cmpVsFlash" class="cmp-vs-flash"></div>
    <div id="cmpVsOverlay" class="cmp-vs-overlay">VS</div>
    <div class="cmp-title">⚔️ Comparación de Pokémon ⚔️</div>
    <div id="cmpCols" class="cmp-cols"></div>
    <div id="cmpStats" class="cmp-stats"></div>
    <!-- Winner screen overlay -->
    <div class="cmp-winner-screen" id="cmpWinnerScreen" aria-hidden="true">
      <canvas id="cmpConfetti" class="cmp-confetti-canvas"></canvas>
      <div class="cmp-winner-inner" id="cmpWinnerInner"></div>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
