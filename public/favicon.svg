<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pokeball -->
  <circle cx="50" cy="50" r="46" fill="#fff" stroke="#000" stroke-width="4"/>
  <!-- Red top half -->
  <path d="M 4 50 A 46 46 0 0 1 96 50 Z" fill="#e63946" stroke="#000" stroke-width="4"/>
  <!-- Center horizontal line -->
  <line x1="4" y1="50" x2="96" y2="50" stroke="#000" stroke-width="6"/>
  <!-- Center button outer -->
  <circle cx="50" cy="50" r="12" fill="#000"/>
  <!-- Center button inner -->
  <circle cx="50" cy="50" r="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <!-- Small highlight -->
  <circle cx="47" cy="47" r="2" fill="#ddd"/>
</svg>
